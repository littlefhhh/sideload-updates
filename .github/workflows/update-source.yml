name: 更新应用源

on:
  schedule:
    - cron: "0 1 * * *"        # 每天 UTC 01:00（北京时间 09:00）检查一次
  workflow_dispatch:            # 也可以在 Actions 页面手动触发
  push:
    paths:
      - config.json
      - gen_source.py
      - .github/workflows/update-source.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成 source.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 gen_source.py \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: 校验 JSON
        run: python3 -m json.tool docs/source.json > /dev/null

      - name: 提交变化
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "没有新版本，跳过提交"
          else
            git commit -m "chore: 同步上游新版本 $(date -u +%Y-%m-%d)"
            git push
          fi
